<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer and Share</title>
  <style>
    .pdf-viewer { width: 100%; height: 500px; border: 1px solid #ccc; margin-top: 10px; }
    .controls { margin-top: 10px; }
    .message { display: none; color: green; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>PDF Viewer</h2>
  <input type="text" id="pdfLink" placeholder="Enter PDF URL here..." value="https://account.mypin.ai/reports/soFormat_14-11-2024_06:25.pdf" />
  <button onclick="loadPDF()">Load PDF</button>
  
  <iframe id="pdfViewer" class="pdf-viewer" src="" hidden></iframe>
  
  <div class="controls">
    <button id="shareButton" onclick="sharePDF()">Share Link</button>
    <button id="shareButton" onclick="sharePDFFile()">Share as file</button>
    <button id="copyButton" onclick="copyToClipboard()">Copy Link</button>
  </div>
  
  <div id="message" class="message">Link copied to clipboard!</div>

  <script>
    // Function to load PDF into iframe
    function loadPDF() {
      const pdfLink = document.getElementById('pdfLink').value;
      const pdfViewer = document.getElementById('pdfViewer');
      pdfViewer.src = pdfLink;
      pdfViewer.hidden = false;
    }

    // Share functionality
    function sharePDF() {
      const pdfLink = document.getElementById('pdfLink').value;
      const canShare = 'share' in navigator;

      if (canShare) {
        navigator.share({ title: document.title, url: pdfLink })
          .catch(error => console.error('Error sharing:', error));
      } else {
        // Fallback for non-supporting devices (social links, etc.)
        alert("Sharing not supported on this device. Copy the link manually.");
      }
    }

    async function sharePDFFile() {
        const pdfLink = document.getElementById('pdfLink').value;
        try {
        const response = await fetch(pdfLink);
        const blob = await response.blob();
        const file = new File([blob], "shared.pdf", { type: "application/pdf" });
        
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({
            files: [file],
            title: 'Shared PDF',
            text: 'Here is the PDF file you requested',
            })
            .catch((error) => console.error('Error sharing file:', error));
        } else {
            alert("File sharing not supported on this device.");
        }
        } catch (error) {
        console.error("Error fetching or sharing file:", error);
        }
    }

    // Copy link to clipboard
    function copyToClipboard() {
      const pdfLink = document.getElementById('pdfLink').value;
      navigator.clipboard.writeText(pdfLink)
        .then(() => {
          const message = document.getElementById('message');
          message.style.display = 'block';
          setTimeout(() => message.style.display = 'none', 2000);
        })
        .catch(error => console.error('Error copying:', error));
    }
  </script>
</body>
</html>
