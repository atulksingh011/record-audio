<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Record Audio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
    body {
      padding: 30px;
      background-color: #f8f9fa;
    }

    .tabs {
      margin-bottom: 20px;
    }

    h3 {
      margin-bottom: 20px;
    }

    .audio-controls {
      margin-bottom: 20px;
    }

    .recording-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .status {
      font-size: 0.9em;
      color: gray;
      margin-top: 10px;
    }

    .audio-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <ul class="nav nav-tabs tabs" id="tabs">
      <li class="nav-item">
        <a class="nav-link" href="/">View Records</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="/record">Record Audio</a>
      </li>
    </ul>

    <!-- Text Display and Speaker Icon -->
    <div class="text-center mt-4">
      <span id="record-text" class="h4">Loading text...</span>
      <span id="speaker-icon" style="display: none; cursor: pointer;">🔊 (click to listen)</span>
    </div>

    <!-- Recording Sections -->
    <div class="row mt-5">
      <div class="col-md-6 recording-section">
        <h3>Record in English</h3>
        <div class="audio-controls">
          <button id="start-english" class="btn btn-primary">Start</button>
          <button id="stop-english" class="btn btn-danger" disabled>Stop</button>
        </div>
        <audio id="english-audio" controls style="display: none;" class="mt-3"></audio>
        <div id="english-status" class="status">Status: Not recording</div>
      </div>

      <div class="col-md-6 recording-section">
        <h3>Record in Hindi</h3>
        <div class="audio-controls">
          <button id="start-hindi" class="btn btn-primary">Start</button>
          <button id="stop-hindi" class="btn btn-danger" disabled>Stop</button>
        </div>
        <audio id="hindi-audio" controls style="display: none;" class="mt-3"></audio>
        <div id="hindi-status" class="status">Status: Not recording</div>
      </div>
    </div>

    <!-- Save Button -->
    <div class="text-center mt-5">
      <button id="save-recording" class="btn btn-success" disabled>Save Recording</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/recordrtc@5.6.2/RecordRTC.min.js"></script>
  <script>
    let englishRecorder, hindiRecorder;
    let englishBlob, hindiBlob;
    const MAX_RECORDING_TIME = 10000; // 10 seconds
    const recordTextEl = document.getElementById("record-text");

    document.addEventListener("DOMContentLoaded", () => {
      fetchTextToRecord();
      document.getElementById("speaker-icon").addEventListener("click", announceRecordText);
      document.getElementById("start-english").addEventListener("click", () => startRecording('english'));
      document.getElementById("stop-english").addEventListener("click", () => stopRecording('english'));
      document.getElementById("start-hindi").addEventListener("click", () => startRecording('hindi'));
      document.getElementById("stop-hindi").addEventListener("click", () => stopRecording('hindi'));
      document.getElementById("save-recording").addEventListener("click", saveRecording);
    });

    function fetchTextToRecord() {
      fetch('/api/fetch')
        .then(response => response.json())
        .then(data => {
          if (data && data.name) {
            recordTextEl.textContent = data.name;
            document.getElementById("speaker-icon").style.display = "inline";
            recordTextEl.dataset.index = data.index;
          } else {
            recordTextEl.textContent = "No text found for recording.";
          }
        })
        .catch(error => console.error("Error fetching text to record:", error));
    }

    async function announceRecordText() {
      const text = recordTextEl.textContent;
      announceText(text);
    }

    async function announceText(text) {
      if (!('speechSynthesis' in window)) {
        console.error('Speech Synthesis not supported in this browser.');
        return;
      }
      const voices = await loadVoices();
      const msg = new SpeechSynthesisUtterance(text);
      msg.rate = 0.6;
      msg.pitch = 1.7;
      msg.voice = voices.find(voice => voice.lang.includes('en-IN')) || voices.find(voice => voice.name === 'Rishi');
      window.speechSynthesis.speak(msg);
    }

    function loadVoices() {
      return new Promise(resolve => {
        let voices = speechSynthesis.getVoices();
        if (voices.length > 0) resolve(voices);
        else speechSynthesis.onvoiceschanged = () => resolve(speechSynthesis.getVoices());
      });
    }

    function startRecording(language) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        const recorder = RecordRTC(stream, { type: 'audio', mimeType: 'audio/wav' });
        
        if (language === 'english') {
          englishRecorder = recorder;
          document.getElementById("english-status").textContent = "Status: Recording...";
          document.getElementById("stop-english").disabled = false;
          document.getElementById("start-english").disabled = true;
        } else {
          hindiRecorder = recorder;
          document.getElementById("hindi-status").textContent = "Status: Recording...";
          document.getElementById("stop-hindi").disabled = false;
          document.getElementById("start-hindi").disabled = true;
        }

        recorder.startRecording();

        // Stop recording after 10 seconds
        setTimeout(() => stopRecording(language), MAX_RECORDING_TIME);
      }).catch(error => console.error(`Recording error for ${language}:`, error));
    }

    function stopRecording(language) {
      let recorder, audioElement, statusElement;
      if (language === 'english') {
        recorder = englishRecorder;
        audioElement = document.getElementById("english-audio");
        statusElement = document.getElementById("english-status");
        document.getElementById("stop-english").disabled = true;
        document.getElementById("start-english").disabled = false;
      } else {
        recorder = hindiRecorder;
        audioElement = document.getElementById("hindi-audio");
        statusElement = document.getElementById("hindi-status");
        document.getElementById("stop-hindi").disabled = true;
        document.getElementById("start-hindi").disabled = false;
      }

      recorder.stopRecording(() => {
        const blob = recorder.getBlob();
        const audioUrl = URL.createObjectURL(blob);
        audioElement.src = audioUrl;
        audioElement.style.display = 'block';
        statusElement.textContent = "Status: Recording saved";

        if (language === 'english') {
          englishBlob = blob;
        } else {
          hindiBlob = blob;
        }

        if (englishBlob && hindiBlob) {
          document.getElementById("save-recording").disabled = false;
        }
      });
    }

    async function saveRecording() {
      const text = recordTextEl.textContent;
      const index = recordTextEl.dataset.index;
      const formData = new FormData();
      formData.append("text", text);
      formData.append("index", index);
      formData.append("english", englishBlob, "english-recording.webm");
      formData.append("hindi", hindiBlob, "hindi-recording.webm");

      fetch('/api/save', { method: 'POST', body: formData })
        .then(response => {
          if (response.ok) {
            alert("Recordings saved successfully!");
            location.reload();
          } else {
            response.text().then(errorText => alert("Failed to save recordings: " + errorText));
          }
        })
        .catch(error => console.error("Error saving recordings:", error));
    }
  </script>
</body>

</html>
